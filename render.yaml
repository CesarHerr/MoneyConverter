databases:
  - name: money_converter
    databaseName: money_converter
    user: money_converter

services:
  - type: web
    name: MoneyConverter
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: money_converter
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false